name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LpDashboard.slnx
      - run: dotnet build LpDashboard.slnx --no-restore -c Release
      - run: dotnet test LpDashboard.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json is not committed, so a plain install is used.
      - run: npm install
      - run: npm run build


  # Every push to main that passes the jobs above is deployed to Azure App Service.
  # One-time setup (secrets and variable) is described in the README.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never run two deploys at once; a newer push waits for the running one.
    concurrency:
      group: deploy-azure
      cancel-in-progress: false
    env:
      APP_NAME: ${{ vars.AZURE_APP_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the registry name
        # Same naming as deploy/azure.ps1: the app name without dashes + "acr".
        run: echo "REGISTRY=${APP_NAME//-/}acr.azurecr.io" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/lp-dashboard:${{ github.sha }}
            ${{ env.REGISTRY }}/lp-dashboard:latest
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/lp-dashboard:${{ github.sha }}
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$APP_NAME.azurewebsites.net/health" > /dev/null; then
              echo "Healthy after attempt $i"; exit 0
            fi
            sleep 10
          done
          echo "App did not become healthy in 5 minutes" >&2
          exit 1
