# Usage: put your RPC URL in a .env file next to this one (it is git-ignored):
#   BASE_RPC_URL=https://base-mainnet.g.alchemy.com/v2/<key>
# Optional Telegram alerts (see README):
#   TELEGRAM_BOT_TOKEN=...
#   TELEGRAM_CHAT_ID=...
# then: docker compose up --build   ->   http://localhost:5080
services:
  lp-dashboard:
    build: .
    ports:
      # Bound to localhost only. The app has a password login, but there is no reason to offer it to the LAN by default.
      - "127.0.0.1:5080:8080"
    environment:
      Evm__Chains__0__RpcUrl: ${BASE_RPC_URL:-}
      Alerts__Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Alerts__Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
      # WAL does not work on a Windows bind mount; DELETE journaling does.
      Database__SqliteJournalMode: DELETE
      # The backup download is off by default (it contains every wallet); this instance is local-only.
      Backup__Enabled: "true"
    volumes:
      # The database is lpdashboard.db in ./data (override the folder with DATA_DIR in .env).
      - ${DATA_DIR:-./data}:/data
    restart: unless-stopped
