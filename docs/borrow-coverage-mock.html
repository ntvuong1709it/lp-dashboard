<title>Borrow Coverage Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: mock-control strip on top, then the real app frame (header, nav, page). Tokens mirror the app's slate scale, dark first. */
:root {
  --bg: #020617;
  --surface: #0f172a;
  --surface2: #162033;
  --border: #1e293b;
  --border2: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --faint: #64748b;
  --sky: #38bdf8;
  --violet: #a78bfa;
  --green: #34d399;
  --rose: #fb7185;
  --amber: #f59e0b;
  --rose-bg: rgba(251,113,133,.13);
  --amber-bg: rgba(245,158,11,.13);
  --green-bg: rgba(52,211,153,.13);
  --sky-bg: rgba(56,189,248,.12);
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6f8; --surface: #ffffff; --surface2: #eef1f5; --border: #e2e7ec; --border2: #cfd6de;
    --text: #1b2430; --muted: #5b6675; --faint: #6b7686;
    --sky: #2a78d6; --violet: #7c4fd6; --green: #0f7d57; --rose: #c23b36; --amber: #b36b00;
    --rose-bg: rgba(194,59,54,.10); --amber-bg: rgba(179,107,0,.12); --green-bg: rgba(15,125,87,.11); --sky-bg: rgba(42,120,214,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f6f8; --surface: #ffffff; --surface2: #eef1f5; --border: #e2e7ec; --border2: #cfd6de;
  --text: #1b2430; --muted: #5b6675; --faint: #6b7686;
  --sky: #2a78d6; --violet: #7c4fd6; --green: #0f7d57; --rose: #c23b36; --amber: #b36b00;
  --rose-bg: rgba(194,59,54,.10); --amber-bg: rgba(179,107,0,.12); --green-bg: rgba(15,125,87,.11); --sky-bg: rgba(42,120,214,.10);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; }

/* Mock controls (not part of the app) */
.mockbar { border: 1px dashed var(--border2); border-radius: 8px; margin-top: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; font-size: 12px; color: var(--muted); background: var(--surface2); }
.mockbar b { color: var(--text); font-weight: 600; }
.mockbar select { background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 8px; font: inherit; }
.mockbar .tag { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--amber); font-weight: 600; }

/* App frame */
.appbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 14px 0; border-bottom: 1px solid var(--border); margin-top: 12px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.nav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 1 1 320px; }
.nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.nav button:hover { color: var(--text); background: var(--surface); }
.nav button[aria-current="page"] { color: var(--text); background: var(--surface); box-shadow: inset 0 -2px 0 var(--sky); }
.wallet { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.wallet i { width: 8px; height: 8px; border-radius: 50%; background: #818cf8; display: inline-block; }

.page { padding-top: 22px; display: flex; flex-direction: column; gap: 18px; }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px; }
.pagehead h1 { font-size: 24px; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

.card { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; }
.cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; margin-bottom: 12px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.hint { font-size: 12px; color: var(--faint); }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }

.seg { display: inline-flex; border: 1px solid var(--border2); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border2); }
.seg button[aria-pressed="true"] { background: var(--sky-bg); color: var(--sky); font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.covered { background: var(--green-bg); color: var(--green); }
.chip.thin { background: var(--amber-bg); color: var(--amber); }
.chip.shortfall { background: var(--rose-bg); color: var(--rose); }
.chip.nodebt { background: var(--surface2); color: var(--muted); }
.chip.ok { background: var(--green-bg); color: var(--green); }
.chip.warn { background: var(--amber-bg); color: var(--amber); }
.chip.crit { background: var(--rose-bg); color: var(--rose); }

.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 10px 14px; border: 1px solid; font-size: 13px; }
.banner.warn { background: var(--amber-bg); border-color: var(--amber); }
.banner.crit { background: var(--rose-bg); border-color: var(--rose); }
.banner.info { background: var(--sky-bg); border-color: var(--sky); }
.banner b { font-weight: 600; }
.banner .bi { font-weight: 700; width: 18px; flex: none; text-align: center; }
.banner.warn .bi { color: var(--amber); } .banner.crit .bi { color: var(--rose); } .banner.info .bi { color: var(--sky); }
.banner .act { margin-left: auto; white-space: nowrap; color: var(--text); text-decoration: underline; background: none; border: 0; padding: 0; }
.progress { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 6px; width: min(320px, 100%); }
.progress i { display: block; height: 100%; width: 49%; background: var(--sky); }

.bignum { font-family: var(--font-mono); font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.mid { font-family: var(--font-mono); font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.pos { color: var(--green); } .neg { color: var(--rose); }
.stat .row { margin-top: 4px; font-size: 12px; color: var(--muted); }
.split { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--surface2); margin-top: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.legend .line::before { height: 3px; border-radius: 2px; vertical-align: 3px; }

.link { background: none; border: 0; padding: 0; color: var(--sky); text-decoration: underline; text-underline-offset: 2px; }
.btn { border: 1px solid var(--border2); background: var(--surface2); border-radius: 6px; padding: 6px 12px; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--sky); border-color: var(--sky); color: #04101c; font-weight: 600; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.ghost { background: none; }

/* Coverage strip on Earnings */
.cover { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.cover .tiny { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bars .line { display: grid; grid-template-columns: 78px minmax(0, 1fr) 76px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bars .track { height: 12px; border-radius: 3px; background: var(--surface2); display: flex; overflow: hidden; }
.bars .val { text-align: right; color: var(--text); }
.health { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

/* Tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.src { font-size: 11px; border: 1px solid var(--border2); border-radius: 4px; padding: 0 6px; color: var(--muted); white-space: nowrap; }
.src.manual { border-color: var(--amber); color: var(--amber); }
.sub2 { font-size: 12px; color: var(--muted); }
.acts { display: flex; gap: 6px; justify-content: flex-end; }

.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.trio .mid { font-size: 20px; }
.lcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.lrow { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 13px; }
.lrow.b { font-weight: 600; }
.lrow.top { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 6px 12px; align-items: end; padding: 10px 0; border-top: 1px solid var(--border); }
.trow .tout { grid-column: 1 / -1; font-size: 13px; }
.trow input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 5px 8px; font: inherit; }
.trow label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.para { margin: 0 0 10px; }
@media (max-width: 700px) { .trio { grid-template-columns: minmax(0, 1fr); } .lcols { grid-template-columns: minmax(0, 1fr); } }
tr.grp td { background: var(--surface2); }
tr.tot td { border-top: 1px solid var(--border2); }
td.b, .b { font-weight: 600; }
.cost td:first-child { white-space: nowrap; }
/* Gauges */
.gauge { position: relative; height: 10px; margin: 18px 0 22px; }
.gz { position: absolute; inset: 0; display: block; border-radius: 99px; overflow: hidden; background: var(--surface2); }
.gz span { position: absolute; top: 0; bottom: 0; opacity: .75; }
.gm { position: absolute; top: -5px; width: 3px; height: 20px; background: var(--text); border-radius: 2px; transform: translateX(-50%); }
.gt { position: absolute; top: 14px; font-size: 10px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.gt::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 6px; background: var(--faint); }
.rkrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 10px; }
.risk + .risk { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; }

/* What-if */
.sliders { display: grid; gap: 14px; }
.sl label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.sl input[type=range] { width: 100%; accent-color: var(--sky); }
.outs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.out { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; background: var(--surface2); }
.out .mid { font-size: 20px; }

/* Form */
.form { display: grid; gap: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 6px 8px; font: inherit; }
.terms { display: grid; gap: 8px; }
.term { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .8fr) auto; gap: 8px; align-items: end; }
.fnote { font-size: 12px; color: var(--muted); }
.divider { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty h2 { color: var(--text); margin-bottom: 6px; }
.placeholder { border: 1px dashed var(--border2); border-radius: 8px; padding: 26px; text-align: center; color: var(--faint); font-size: 13px; }
svg text { fill: var(--muted); font-family: var(--font-sans); font-size: 11px; }
svg .tick { stroke: var(--border); stroke-width: 1; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }

@media (max-width: 900px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g21, .g2 { grid-template-columns: minmax(0, 1fr); }
  .cover { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .g4 { grid-template-columns: minmax(0, 1fr); }
  .term { grid-template-columns: 1fr 1fr; }
  .bignum { font-size: 30px; }
}
</style>

<div class="wrap">
  <div class="mockbar" role="group" aria-label="Mock controls">
    <span class="tag">Mock, example data</span>
    <span><b>Screen</b> <span class="seg" id="viewSeg"></span></span>
    <label><b>State</b>
      <select id="scenario" aria-label="Preview state">
        <option value="covered">Covered (healthy)</option>
        <option value="thin">Thin coverage</option>
        <option value="shortfall">Shortfall</option>
        <option value="backfill">Aave backfill running</option>
        <option value="noloans">No loans yet</option>
      </select>
    </label>
    <span>Nothing here is wired to the app. Numbers come from a generated 90-day sample.</span>
  </div>

  <header class="appbar">
    <span class="brand">LP Dashboard</span>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <span class="wallet"><i></i><span class="num">2 wallets</span></span>
  </header>

  <main class="page" id="app"></main>
</div>
<div id="toastHost"></div>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var usd = function (n, d) {
    d = d == null ? 2 : d;
    return (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  var dshort = function (dt) { return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }); };

  /* ---------- sample data (90 days, deterministic) ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var R = rng(42), DAYS = 90, END = Date.UTC(2026, 10, 7), DATA = [];
  for (var i = 0; i < DAYS; i++) {
    var fees = 3.7 + (R() - .5) * 3.6; if (R() < .08) fees = 0.3 + R() * .5; if (fees < .5) fees = .5 + R() * .3;
    DATA.push({
      date: new Date(END - (DAYS - 1 - i) * 864e5),
      fees: fees,
      rewards: 1.7 + (R() - .5) * 1.0,
      supply: .85 + (R() - .5) * .1,
      ia: 14200 * (0.056 + (R() - .5) * .008) / 365,
      ib: 6000 * (i < 48 ? 0.084 : 0.092) / 365,
      gas: R() < .07 ? 1.1 + R() * 1.4 : 0
    });
  }
  var MULT = { covered: 1, backfill: 1, thin: .62, shortfall: .35, noloans: 1 };
  var LP_VALUE = 28400;
  var AAVE = { debt: 14200, apr: 5.8, hf: 1.74, collat: 32800 };
  var BIN = { debt: 6000, apr: 9.2, ltv: 71, liq: 80, margin: 75 };
  var RUN = AAVE.debt * AAVE.apr / 100 / 365 + BIN.debt * BIN.apr / 100 / 365;

  /* Collateral and debt history. Built backwards from today's balances so each day follows from the next. */
  var P = [], PB = [], pi;
  for (pi = 0; pi < DAYS; pi++) {
    var pbase = pi <= 60 ? .93 + .19 * (pi / 60) : 1.12 - .12 * ((pi - 60) / 29);
    P.push(pbase * (1 + (R() - .5) * .03)); PB.push(pbase * (1 + (R() - .5) * .04));
  }
  (function () { var a = P[DAYS - 1], b = PB[DAYS - 1]; P = P.map(function (v) { return v / a; }); PB = PB.map(function (v) { return v / b; }); })();
  function holdings(price, collatEnd, debtEnd, deps, bors, yieldOn, intKey) {
    var H = { tok: [], debt: [], dep: new Array(DAYS).fill(0), bor: new Array(DAYS).fill(0) };
    deps.forEach(function (d) { H.dep[d[0]] = d[1] / price[d[0]]; });
    bors.forEach(function (b) { H.bor[b[0]] = b[1]; });
    H.tok[DAYS - 1] = collatEnd / price[DAYS - 1]; H.debt[DAYS - 1] = debtEnd;
    for (var i = DAYS - 2; i >= 0; i--) {
      H.tok[i] = H.tok[i + 1] - (yieldOn ? DATA[i + 1].supply / price[i + 1] : 0) - H.dep[i + 1];
      H.debt[i] = H.debt[i + 1] - DATA[i + 1][intKey] - H.bor[i + 1];
    }
    return H;
  }
  var HA = holdings(P, AAVE.collat, AAVE.debt, [[55, 2000]], [[35, 1500]], true, "ia");
  var HB = holdings(PB, BIN.debt / (BIN.ltv / 100), BIN.debt, [[70, 700]], [], false, "ib");

  var state = {
    view: "borrow", scenario: "covered", win: 30, form: null, cd: "all", per: "m", tg: { hf: 2, ltv: 60 }, coll: [],
    terms: [], wi: { rate: 100, inc: 100, move: 0 }
  };

  function stats(win) {
    var m = MULT[state.scenario], d = DATA.slice(-win);
    var s = { win: win, fees: 0, rew: 0, sup: 0, ia: 0, ib: 0, gas: 0 };
    d.forEach(function (x) { s.fees += x.fees * m; s.rew += x.rewards * m; s.sup += x.supply; s.ia += x.ia; s.ib += x.ib; s.gas += x.gas; });
    s.income = s.fees + s.rew + s.sup; s.interest = s.ia + s.ib;
    s.net = s.income - s.interest - s.gas; s.ratio = s.interest ? s.income / s.interest : null;
    return s;
  }
  function status(r) { return r == null ? "nodebt" : r >= 1.25 ? "covered" : r >= 1 ? "thin" : "shortfall"; }
  var STATUS_TXT = { covered: "Covered", thin: "Thin", shortfall: "Shortfall", nodebt: "No interest" };
  var chip = function (st) { return '<span class="chip ' + st + '">' + STATUS_TXT[st] + "</span>"; };
  var hasLoans = function () { return state.scenario !== "noloans"; };

  /* ---------- small components ---------- */
  function gauge(o) {
    var p = function (v) { return Math.max(0, Math.min(100, (v - o.min) / (o.max - o.min) * 100)); };
    var z = o.zones.map(function (z) { return '<span style="left:' + p(z.from) + "%;width:" + (p(z.to) - p(z.from)) + "%;background:var(--" + z.c + ')"></span>'; }).join("");
    var t = (o.ticks || []).map(function (k) { return '<span class="gt" style="left:' + p(k.v) + '%">' + k.t + "</span>"; }).join("");
    return '<div class="gauge" role="img" aria-label="' + o.aria + '"><span class="gz">' + z + '</span><i class="gm" style="left:' + p(o.value) + '%"></i>' + t + "</div>";
  }
  var hfGauge = function (v) { return gauge({ min: 1, max: 2.5, value: v, aria: "Health factor " + v.toFixed(2), zones: [{ from: 1, to: 1.2, c: "rose" }, { from: 1.2, to: 1.5, c: "amber" }, { from: 1.5, to: 2.5, c: "green" }], ticks: [{ v: 1.2, t: "1.2 critical" }, { v: 1.5, t: "1.5 warn" }] }); };
  var ltvGauge = function (v) { return gauge({ min: 40, max: 90, value: v, aria: "LTV " + v.toFixed(0) + " percent", zones: [{ from: 40, to: 68, c: "green" }, { from: 68, to: 76, c: "amber" }, { from: 76, to: 90, c: "rose" }], ticks: [{ v: 68, t: "68 warn" }, { v: 75, t: "75 margin call" }, { v: 80, t: "80 liquidation" }] }); };
  function hfLevel(h) { return h < 1.2 ? "crit" : h < 1.5 ? "warn" : "ok"; }

  }
  function borrowView() {
    var head = '<div class="pagehead"><div><h1>Borrow</h1><div class="sub">Does LP income pay the interest on your loans?</div></div>' + (hasLoans() ? winSeg() : "") + "</div>";
    if (!hasLoans()) {
      return head + '<section class="card empty"><h2>No loans yet</h2><p style="margin:0 0 14px">Aave debt is read from chain for your followed wallets. Add a manual loan for anything else, such as Binance.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" data-act="toast" data-v="Reads Aave positions for 0x7a3f…c91e (mock)">Check Aave for this wallet</button><button class="btn" data-act="form" data-v="add">Add manual loan</button></div></section>' + formPanel();
    }
    var s = stats(state.win), st = status(s.ratio);
    return head + bannersFor(true) + summaryTiles(s, st) + costPanel() + formPanel() +
      '<div class="grid g21"><section class="card"><div class="cardhead"><h2>Income against interest, per day</h2><div class="legend"><span style="--c:var(--sky)">Fees</span><span style="--c:var(--violet)">Rewards</span><span style="--c:var(--green)">Aave supply yield</span><span class="line" style="--c:var(--rose)">Interest</span></div></div>' +
      chart(state.win) + '<div class="cardhead" style="margin:14px 0 4px"><span class="label">Cumulative net carry</span><span class="hint">after interest and gas</span></div>' + cumChart(state.win) + "</section>" + runRatePanel(s) + "</div>" +
      loansTable(s) + cdSection() + '<div class="grid g2">' + changesCard() + steadyCard() + "</div>" + '<div class="grid g2">' + riskPanel() + '<div style="display:flex;flex-direction:column;gap:12px;min-width:0">' + repayPanel(s) + "</div></div>" + whatIfPanel() +
      '<div class="hint">Aave synced 4 min ago · history from 14 Mar 2026 · 0 days missing prices · LP income comes from the same accrued figures as the Earnings page.</div>';
  }

  /* ---------- shell ---------- */
  var NAV = [["overview", "Overview"], ["positions", "Positions"], ["earnings", "Earnings"], ["pools", "Pools"], ["borrow", "Borrow"], ["features", "Features"], ["addresses", "Addresses"]];
  function renderNav() {
    $("#nav").innerHTML = NAV.map(function (n) { return '<button data-act="nav" data-v="' + n[0] + '"' + (n[0] === state.view ? ' aria-current="page"' : "") + (n[0] === "borrow" ? ' data-new="1"' : "") + ">" + n[1] + (n[0] === "borrow" ? ' <span class="chip ok" style="padding:0 6px;font-size:10px">new</span>' : "") + "</button>"; }).join("");
    $("#viewSeg").innerHTML = [["earnings", "Earnings card"], ["borrow", "Borrow page"]].map(function (v) { return '<button data-act="goto" data-v="' + v[0] + '" aria-pressed="' + (state.view === v[0]) + '">' + v[1] + "</button>"; }).join("");
  }
  function render() {
    renderNav();
    $("#app").innerHTML = state.view === "earnings" ? earningsView() : state.view === "borrow" ? borrowView() : '<div class="placeholder">Existing page, not part of this mock.</div>';
    wire();
  }
  function wire() {
    var map = { rate: "wi-rate", inc: "wi-inc", move: "wi-move" };
    Object.keys(map).forEach(function (k) {
      var el = $("#" + map[k]); if (!el) return;
      el.addEventListener("input", function () { state.wi[k] = +el.value; updateWhatIf(); });
    });
    updateWhatIf();
    [["t-hf", "hf"], ["t-ltv", "ltv"]].forEach(function (p) {
      var el = $("#" + p[0]); if (!el) return;
      el.addEventListener("input", function () { var v = +el.value; if (v > 0) { state.tg[p[1]] = v; updateTargets(); } });
    });
    updateTargets();
    document.querySelectorAll("[data-coll]").forEach(function (el) {
      el.addEventListener("input", function () { var t = state.coll[+el.dataset.coll]; t[el.dataset.k] = el.dataset.k === "from" ? el.value : +el.value; });
    });
    document.querySelectorAll("[data-term]").forEach(function (el) {
      el.addEventListener("input", function () {
        var t = state.terms[+el.dataset.term]; t[el.dataset.k] = el.dataset.k === "from" ? el.value : +el.value;
        var l = state.terms[state.terms.length - 1], pd = l.principal * l.apr / 100 / 365;
        $("#termPreview").innerHTML = 'At the latest terms this accrues <b class="num">' + usd(pd) + '</b> a day (simple interest, ' + usd(pd * 30, 0) + " per 30 days).";
      });
    });
  }
  function toast(t) {
    var e = document.createElement("div"); e.className = "toast"; e.setAttribute("role", "status"); e.textContent = t; $("#toastHost").appendChild(e);
    setTimeout(function () { e.remove(); }, 2200);
  }
  function go(v) { state.view = v; state.form = null; try { location.hash = v; } catch (e) { } render(); window.scrollTo(0, 0); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act, v = b.dataset.v;
    if (a === "win") { state.win = +v; render(); }
    else if (a === "cd") { state.cd = v; render(); }
    else if (a === "per") { state.per = v; render(); }
    else if (a === "addcoll") { var lc = state.coll[state.coll.length - 1]; state.coll.push({ from: "2026-11-07", amount: lc.amount }); render(); }
    else if (a === "rmcoll") { state.coll.splice(+v, 1); render(); }
    else if (a === "goto" || a === "nav") { go(v === "overview" || v === "positions" || v === "pools" || v === "features" || v === "addresses" ? "other" : v); }
    else if (a === "toast") toast(v);
    else if (a === "form") {
      state.form = v;
      state.terms = v === "edit" ? [{ from: "2026-04-02", principal: 6000, apr: 8.4 }, { from: "2026-09-20", principal: 6000, apr: 9.2 }] : [{ from: "2026-11-07", principal: 5000, apr: 9.0 }];
      state.coll = v === "edit" ? [{ from: "2026-04-02", amount: 0.138 }, { from: "2026-10-19", amount: 0.15 }] : [{ from: "2026-11-07", amount: 0.15 }];
      render(); var f = $("#formCard"); if (f) f.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    else if (a === "closeform") { state.form = null; render(); }
    else if (a === "saveform") { state.form = null; render(); toast("Saved (mock). Interest is recalculated on the next sync."); }
    else if (a === "addterm") { var l = state.terms[state.terms.length - 1]; state.terms.push({ from: "2026-11-07", principal: l.principal, apr: l.apr }); render(); }
    else if (a === "rmterm") { state.terms.splice(+v, 1); render(); }
    else if (a === "wireset") { state.wi = { rate: 100, inc: 100, move: 0 }; render(); }
  });
  $("#scenario").addEventListener("change", function (e) { state.scenario = e.target.value; render(); });
  window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if ((h === "earnings" || h === "borrow") && h !== state.view) { state.view = h; state.form = null; render(); } });
  var h0 = ""; try { h0 = location.hash.slice(1); } catch (e) { }
  if (h0 === "earnings" || h0 === "borrow") state.view = h0;
  render();
})();
</script>
